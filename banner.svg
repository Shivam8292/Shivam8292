<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <style>
    .bg { fill: #0d1117; }
    .title {
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: url(#glowGrad);
      text-anchor: middle;
      filter: drop-shadow(0px 0px 8px #00ffcc);
      animation: pulsate 3s ease-in-out infinite alternate;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #8b949e;
      text-anchor: middle;
    }
    .grid-line {
      stroke: rgba(0, 255, 204, 0.1);
      stroke-width: 1;
      animation: scan 6s linear infinite;
    }
    .node {
      fill: #00ffcc;
      animation: blink 2s infinite ease-in-out;
    }
    .conn-line {
      stroke: rgba(0, 255, 204, 0.3);
      stroke-width: 0.5;
      stroke-dasharray: 4;
      animation: dash 5s linear infinite;
    }
    @keyframes pulsate {
      0% { filter: drop-shadow(0px 0px 4px #00ffcc); opacity: 0.9; }
      100% { filter: drop-shadow(0px 0px 15px #ff7a00); opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(250px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 1; r: 5; fill: #ff7a00; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
  </style>
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="10" class="bg" />

  <!-- Animated Grid Background -->
  <g opacity="0.5">
    <line x1="0" y1="40" x2="800" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="800" y2="80" class="grid-line" style="animation-delay: 1.5s;" />
    <line x1="0" y1="120" x2="800" y2="120" class="grid-line" style="animation-delay: 3s;" />
    <line x1="0" y1="160" x2="800" y2="160" class="grid-line" style="animation-delay: 4.5s;" />
  </g>

  <!-- Neural Network Live Nodes -->
  <g>
    <!-- Connective lines -->
    <line x1="50" y1="50" x2="120" y2="100" class="conn-line" />
    <line x1="120" y1="100" x2="80" y2="150" class="conn-line" />
    <line x1="750" y1="50" x2="680" y2="110" class="conn-line" />
    <line x1="680" y1="110" x2="720" y2="160" class="conn-line" />

    <!-- Animated Nodes -->
    <circle cx="50" cy="50" r="4" class="node" style="animation-delay: 0s;" />
    <circle cx="120" cy="100" r="4" class="node" style="animation-delay: 0.5s;" />
    <circle cx="80" cy="150" r="4" class="node" style="animation-delay: 1s;" />
    <circle cx="750" cy="50" r="4" class="node" style="animation-delay: 0.2s;" />
    <circle cx="680" cy="110" r="4" class="node" style="animation-delay: 0.7s;" />
    <circle cx="720" cy="160" r="4" class="node" style="animation-delay: 1.2s;" />
  </g>

  <!-- Typography -->
  <text x="400" y="100" class="title">SHIVAM KUMAR</text>
  <text x="400" y="145" class="subtitle">⚡ AI / RAG &amp; SEMANTIC SEARCH DEVELOPER ⚡</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&amp;family=JetBrains+Mono:wght@200;300;400&amp;display=swap');
    .bg { fill: #09090b; }
    .text-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 200;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .text-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 300;
      font-size: 13px;
      fill: #71717a;
      letter-spacing: 1px;
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #52525b;
      letter-spacing: 1px;
    }
    .status-dot {
      fill: #10b981;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .border-line {
      stroke: #18181b;
      stroke-width: 1;
    }
    .cursor {
      fill: #71717a;
      animation: blink 0.8s infinite steps(2);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 3; filter: drop-shadow(0 0 0px #10b981); }
      50% { opacity: 1; r: 4.5; filter: drop-shadow(0 0 4px #10b981); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
  
  <defs>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0; 250; 250; 0" keyTimes="0; 0.6; 0.9; 1" dur="5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="800" height="160" rx="8" class="bg" />
  
  <!-- Subtle divider lines -->
  <line x1="40" y1="30" x2="760" y2="30" class="border-line" />
  <line x1="40" y1="130" x2="760" y2="130" class="border-line" />

  <!-- Name & Title -->
  <g transform="translate(60, 84)">
    <text class="text-name" x="0" y="0">shivam kumar</text>
    <g transform="translate(2, 10)">
      <g clip-path="url(#typeClip)">
        <text class="text-title" x="0" y="14">systems &amp; intelligent pipelines</text>
      </g>
      <rect class="cursor" x="235" y="2" width="6" height="14">
        <animate attributeName="x" values="0; 235; 235; 0" keyTimes="0; 0.6; 0.9; 1" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(670, 72)">
    <circle cx="0" cy="0" r="3.5" class="status-dot" />
    <text class="status-text" x="12" y="4">SYS_ACTIVE</text>
  </g>
</svg>

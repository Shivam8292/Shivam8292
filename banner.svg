<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Inter:wght@400&amp;display=swap');
    .bg { fill: #0a0e14; }
    .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 56px;
      font-weight: 900;
      fill: #00d2ff;
      text-anchor: middle;
      letter-spacing: 4px;
      filter: drop-shadow(0 0 8px rgba(0,210,255,0.6));
    }
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 2px;
      opacity: 0.9;
    }
  </style>
  <rect width="800" height="200" rx="8" class="bg" />
  
  <!-- Subtle cyber accent line at the bottom -->
  <line x1="0" y1="198" x2="800" y2="198" stroke="#00d2ff" stroke-width="4" opacity="0.8" />
  
  <text x="400" y="105" class="title">SHIVAM KUMAR</text>
  <text x="400" y="150" class="subtitle">I find patterns in data. I build intelligence in systems.</text>
</svg>
